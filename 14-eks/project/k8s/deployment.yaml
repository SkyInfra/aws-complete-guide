apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-demo
  namespace: eks-demo
  labels:
    app: eks-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eks-demo
  template:
    metadata:
      labels:
        app: eks-demo
    spec:
      serviceAccountName: eks-demo

      # Spread the pods across nodes so the dashboard has something to show.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: eks-demo

      containers:
        - name: eks-demo
          # TODO: replace with your own ECR image
          image: "830955873996.dkr.ecr.us-east-1.amazonaws.com/eks-demo:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            # Downward API: Kubernetes tells the container who and where it is.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Shown in the top bar.
            - name: CLUSTER_NAME
              value: "eks-demo"
            - name: AWS_REGION
              value: "us-east-1"   # TODO: your region
            - name: ENVIRONMENT
              value: "Development"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
